# plane — the paper plane one Ledgeling throws to another after a long spell
# with no bumps, and the letter it unfolds into once caught. A reminder's plane
# also turns head-on (`front`) as it comes at the user and opens (`opening`).
# Both glyphs are drawn in blocky's rules: flat fill, 1px dark rim, a light
# edge top-left, a shade edge bottom-right. The plane points RIGHT; the app
# turns it to the way it flies and flips it upright when it heads left.
#
#   python -m spritetool build sprites/plane.yaml

version: 1
name: plane
output: Sources/Ledgelings/Resources/sprites

grid:
  cell: [18, 12]
  content_box: [0, 0, 18, 12]

background:
  color: "#ff00ff"
  tolerance: 60

painter: plane

style: >-
  pixel art, flat colour, 1px dark outline, no gradients, no anti-aliasing,
  a folded white paper plane seen from the side, nose to the right

poses:
  - {name: plane,  prompt: a paper plane from the side, nose right, wing on top, keel below}
  - {name: letter, prompt: the unfolded note, a small sheet with three lines of scribble}
  - {name: front,   prompt: the plane head-on, flying straight at the viewer, wings level, keel below}
  - {name: opening, prompt: the plane halfway unfolded into a sheet, centre crease still showing}

animations:
  fly:    {frames: [plane], fps: 1, loop: true}
  letter: {frames: [letter], fps: 1, loop: true}
  front:   {frames: [front], fps: 1, loop: true}
  opening: {frames: [opening], fps: 1, loop: true}
