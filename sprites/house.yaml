# house — where the Ledgelings hide when asked to go away for a while.
# One cell, drawn STANDING ON THE FLOOR of the cell, so it sits on the bottom
# edge of the main screen and can shrink to nothing about its own centre.
#
#   python -m spritetool build sprites/house.yaml

version: 1
name: house
output: Sources/Ledgelings/Resources/sprites

grid:
  cell: [40, 36]
  content_box: [2, 2, 36, 34]

background:
  color: "#ff00ff"
  tolerance: 60

painter: house

style: >-
  pixel art, flat colour, 1px dark outline, a small cottage with a red tiled
  roof, cream walls, an arched brown door and two blue windows

poses:
  - {name: house, prompt: a cute little cottage, door in the middle, chimney on the right}

animations:
  house: {frames: [house], fps: 1, loop: true}
