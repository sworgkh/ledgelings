# house — where the Ledgelings hide when asked to go away for a while.
# One cell, drawn STANDING ON THE FLOOR of the cell, so it sits in the bottom
# right corner of the main screen and can shrink to nothing about its own centre.
# Drawn with the creature's own rules: flat blocks, dark-tint outline, light
# line top-left, shade line bottom-right, black squares for windows.
#
#   python -m spritetool build sprites/house.yaml

version: 1
name: house
output: Sources/Ledgelings/Resources/sprites

grid:
  cell: [68, 60]
  # The glyph fills the box; the doorway is on the left, 26px wide and 28px
  # tall from the floor, so a creature (22px body) walks straight in.
  content_box: [2, 2, 64, 58]

background:
  color: "#ff00ff"
  tolerance: 60

painter: house

style: >-
  pixel art, flat colour, 1px outline in a dark tint of each block's colour,
  a squat cottage of plain blocks: cream wall, two red roof slabs, a stone
  chimney, a dark open doorway on the left, two black square windows

# "door" is the doorway on its own, at the same place in the cell. The app draws
# it in front of the creatures and the rest of the house behind them, so a
# creature walks up the front of the house and disappears into the doorway.
poses:
  - {name: house, prompt: a squat blocky cottage, open doorway on the left, chimney on the right}
  - {name: door,  prompt: only the dark open doorway of that cottage, nothing else}

animations:
  house: {frames: [house], fps: 1, loop: true}
  door:  {frames: [door], fps: 1, loop: true}
